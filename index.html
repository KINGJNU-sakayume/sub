<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>역 도장깨기</title>
  <meta name="description" content="서울 지하철 1~9호선 역을 무작위로 뽑아 다녀오고, 사진 스티커로 남기는 개인 기록 페이지">
  <meta name="theme-color" content="#e2e7e4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300a84d'/%3E%3Ctext x='16' y='22.5' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E역%3C/text%3E%3C/svg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="도장깨기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="sign.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>역 도장깨기</h1>
      <nav class="views" aria-label="보기 방식"><a href="index.html" aria-current="page">역명판</a><a href="map.html">지도</a></nav>
      <button type="button" class="rec-btn" id="openRecord">기록</button>
    </header>

    <main>
      <section aria-label="뽑은 역">
        <div class="sign-wrap">
          <div class="sign" id="sign" data-state="idle" aria-hidden="true">
            <div class="sign-band"></div>
            <div class="sign-body">
              <div class="nb prev" id="prev"><i class="tri"></i><span id="prevName"></span></div>
              <div class="core">
                <div class="badge" id="badge"><span id="badgeNum"></span></div>
                <div class="names">
                  <div class="ko-win"><div class="ko" id="ko">다음 역은</div></div>
                  <div class="en" id="en">Next station</div>
                </div>
              </div>
              <div class="nb next" id="next"><span id="nextName"></span><i class="tri"></i></div>
            </div>
            <div class="xfer" id="xfer"></div>
          </div>
          <div id="stickerSlot"></div>
        </div>

        <div class="controls">
          <button type="button" class="draw" id="draw">역 뽑기</button>
          <label class="switch">
            <input type="checkbox" id="unvisited" checked>
            <span class="box" aria-hidden="true"></span>
            <span>도장 없는 역에서만 뽑기</span>
          </label>
        </div>
        <p class="note" id="note" role="status"></p>
      </section>

      <section class="board" id="board" hidden aria-label="이 역 안내"></section>
    </main>
  </div>

  <div class="sr" id="live" aria-live="polite"></div>
  <noscript><p style="padding:24px">이 페이지는 자바스크립트가 켜져 있어야 동작해요.</p></noscript>

  <script src="data.js"></script>
  <script src="access.js"></script>
  <script src="geo.js"></script>
  <script src="core/base.js"></script>
  <script src="core/sound.js"></script>
  <script src="core/draw.js"></script>
  <script src="core/route.js"></script>
  <script src="core/sticker.js"></script>
  <script src="core/backup.js"></script>
  <script src="core/seal.js"></script>
  <script src="core/origin.js"></script>
  <script src="core/board.js"></script>
  <script src="core/drawer.js"></script>
  <script src="sign.js"></script>
</body>
</html>
