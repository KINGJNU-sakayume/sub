<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>역 도장깨기 · 지도</title>
  <meta name="description" content="서울 지도 위에서 노선을 뽑고 역을 뽑는 지하철 도장깨기">
  <meta name="theme-color" content="#f3f4f2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300a84d'/%3E%3Ctext x='16' y='22.5' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E역%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header class="top">
    <h1>역 도장깨기</h1>
    <a class="alt-link" href="index.html">역명판으로 보기</a>
    <button type="button" class="rec-btn" id="openRecord">기록</button>
  </header>

  <main class="stage">
    <div class="mapbox">
      <div id="map" role="application" aria-label="서울 지하철 노선 지도"></div>
      <p class="maperr" id="maperr" hidden>지도를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>
      <div class="dock">
        <button type="button" class="draw" id="draw">역 뽑기</button>
        <label class="switch">
          <input type="checkbox" id="unvisited" checked>
          <span class="box" aria-hidden="true"></span>
          <span>안 가본 역만</span>
        </label>
      </div>
      <p class="note" id="note" role="status"></p>
    </div>

    <aside class="panel" id="panel" hidden>
      <button type="button" class="panel-toggle" id="panelToggle" aria-expanded="true">안내 접기</button>
      <div class="panel-head" id="panelHead"></div>
      <div class="board" id="board"></div>
    </aside>
  </main>

  <div class="sr" id="live" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data.js"></script>
  <script src="geo.js"></script>
  <script src="core.js"></script>
  <script src="map.js"></script>
</body>
</html>
