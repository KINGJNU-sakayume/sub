<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>역 도장깨기 · 지도</title>
  <meta name="description" content="노선과 역을 무작위로 뽑아 탐험하고, 직접 다녀온 역도 스티커로 남기는 지하철 지도">
  <meta name="theme-color" content="#f3f4f2">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2300a84d'/%3E%3Ctext x='16' y='22.5' font-size='18' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E역%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="도장깨기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header class="top">
    <h1>역 도장깨기</h1>
    <nav class="views" aria-label="보기 방식"><a href="index.html">역명판</a><a href="map.html" aria-current="page">지도</a></nav>
    <button type="button" class="rec-btn" id="openRecord">기록</button>
  </header>

  <main class="stage">
    <div class="mapbox">
      <div id="map" role="application" aria-label="서울 지하철 노선 지도" aria-describedby="mapHelp"></div>
      <p class="sr" id="mapHelp">지도의 역 점은 마우스나 터치로 골라요. 키보드로는 기록 버튼을 열어 역 직접 찾기에서 역을 고를 수 있어요.</p>
      <p class="maperr" id="maperr" hidden>지도를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>
      <div class="dock">
        <button type="button" class="draw" id="draw">역 뽑기</button>
        <label class="switch">
          <input type="checkbox" id="unvisited" checked>
          <span class="box" aria-hidden="true"></span>
          <span>도장 없는 역만</span>
        </label>
      </div>
      <p class="note" id="note" role="status"></p>
      <button type="button" class="panel-unfold" id="panelUnfold" aria-controls="panel" hidden>안내 보기</button>
    </div>

    <aside class="panel" id="panel" hidden>
      <button type="button" class="panel-toggle" id="panelToggle" aria-expanded="true" aria-label="안내 접기"><span class="grip" aria-hidden="true"></span></button>
      <div class="panel-head" id="panelHead"></div>
      <button type="button" class="panel-fold" id="panelFold" aria-controls="panel">안내 접기</button>
      <div class="board" id="board"></div>
    </aside>
  </main>

  <div class="sr" id="live" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data.js"></script>
  <script src="access.js"></script>
  <script src="geo.js"></script>
  <script src="core/base.js"></script>
  <script src="core/sound.js"></script>
  <script src="core/draw.js"></script>
  <script src="core/route.js"></script>
  <script src="core/sticker.js"></script>
  <script src="core/backup.js"></script>
  <script src="core/seal.js"></script>
  <script src="core/origin.js"></script>
  <script src="core/card.js"></script>
  <script src="core/board.js"></script>
  <script src="core/drawer.js"></script>
  <script src="map.js"></script>
</body>
</html>
