name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check scripts
        run: |
          for f in data.js geo.js access.js core/*.js sign.js map.js; do node --check "$f"; done

      - name: Check curated draft
        run: |
          out=$(node tools/merge-curated.mjs --dry 2>&1)
          echo "$out"
          if echo "$out" | grep -q '^경고'; then exit 1; fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.mjs http://localhost:8765/
