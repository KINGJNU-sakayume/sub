name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html map.html common.css sign.css map.css data.js geo.js access.js sign.js map.js _site/
          cp manifest.webmanifest _site/
          sed "s/__VERSION__/${GITHUB_SHA::12}/" sw.js > _site/sw.js
          cp -r core _site/
          cp -r icons _site/
          mkdir _site/tools
          cp tools/geo-check.html tools/place-check.html _site/tools/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
